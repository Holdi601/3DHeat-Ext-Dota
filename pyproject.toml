[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heat3d-ext-dota"
version = "0.1.0"
description = "Dota 2's map from your own install into a 3DHeat level: ground, cliffs, water, trees and buildings, read by Source2Viewer's CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
heat3d-dota-maps = "heat3d_ext_dota.cli:main"

[tool.setuptools]
packages = ["heat3d_ext_dota", "heat3d_update"]
